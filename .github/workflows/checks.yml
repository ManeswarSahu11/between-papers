name: Python checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent-service/requirements.txt
            frontend/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r agent-service/requirements.txt -r frontend/requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q agent-service frontend Docker-NLP
      - run: python -m pytest -q
